<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Control | LRK Computer Institute</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --edu-blue: #1a73e8; --edu-dark: #0d47a1; --white: #ffffff; 
            --bg: #f0f4f8; --success: #2e7d32; --danger: #d32f2f; --accent: #ffd700;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        
        .container { max-width: 1000px; margin: auto; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Stats Section */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { 
            background: white; padding: 25px; border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid var(--edu-blue);
            display: flex; align-items: center; justify-content: space-between;
        }
        .stat-info h3 { margin: 0; color: var(--edu-dark); font-size: 28px; }
        .stat-info p { margin: 5px 0 0; color: #666; font-size: 13px; font-weight: 600; }
        .stat-icon { font-size: 35px; color: var(--edu-blue); opacity: 0.15; }

        /* Admin Form Box */
        .admin-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); margin-bottom: 35px; position: relative; }
        .admin-box h4 { margin: 0 0 20px 0; color: var(--edu-dark); display: flex; align-items: center; gap: 10px; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
        input, select { width: 100%; padding: 14px; border: 2px solid #eef0f2; border-radius: 12px; box-sizing: border-box; font-size: 15px; transition: 0.3s; }
        input:focus { border-color: var(--edu-blue); outline: none; background: #fcfdfe; }
        
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }

        .btn-sync { 
            background: var(--edu-blue); color: white; border: none; padding: 18px; 
            width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; 
            margin-top: 25px; display: flex; align-items: center; justify-content: center; gap: 12px;
            font-size: 16px; transition: 0.3s;
        }
        .btn-sync:hover { background: var(--edu-dark); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(26,115,232,0.3); }
        .btn-sync:disabled { background: #cbd5e0; cursor: not-allowed; }

        /* Table Design */
        .table-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fc; color: var(--edu-dark); padding: 18px; text-align: left; font-size: 13px; text-transform: uppercase; border-bottom: 2px solid #eee; }
        td { padding: 15px 18px; border-bottom: 1px solid #f1f1f1; font-size: 14px; }
        tr:hover { background: #fafbfc; }

        .badge { padding: 5px 12px; border-radius: 8px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-blue { background: #e8f0fe; color: var(--edu-blue); }
        .badge-success { background: #e6f4ea; color: var(--success); }

        /* Toast Notification */
        #toast { position: fixed; bottom: 30px; right: 30px; padding: 15px 30px; border-radius: 10px; color: white; font-weight: bold; display: none; z-index: 1000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="container">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px;">
        <h2 style="color: var(--edu-dark); margin: 0;"><i class="fas fa-shield-alt"></i> LRK ADMIN PANEL <span style="font-weight: 300; font-size: 16px;">v2.0</span></h2>
        <button onclick="loadData()" style="background:none; border:none; color:var(--edu-blue); cursor:pointer; font-weight:bold;"><i class="fas fa-sync"></i> Refresh Cloud</button>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-info">
                <h3 id="totalQ">0</h3>
                <p>TOTAL QUESTIONS</p>
            </div>
            <i class="fas fa-folder-open stat-icon"></i>
        </div>
        <div class="stat-card" style="border-color: var(--success);">
            <div class="stat-info">
                <h3 id="currentLvl">Level 1</h3>
                <p>ACADEMIC STATUS</p>
            </div>
            <i class="fas fa-medal stat-icon"></i>
        </div>
    </div>

    <div class="admin-box">
        <h4><i class="fas fa-plus-circle"></i> Add New Content / नया प्रश्न जोड़ें</h4>
        
        <div class="input-group">
            <label>QUESTION TEXT (HINDI/ENGLISH)</label>
            <input type="text" id="qTxt" placeholder="Enter question here...">
        </div>
        
        <div class="grid-options">
            <div class="input-group">
                <label>OPTION A</label>
                <input type="text" id="opA" placeholder="Answer 1">
            </div>
            <div class="input-group">
                <label>OPTION B</label>
                <input type="text" id="opB" placeholder="Answer 2">
            </div>
            <div class="input-group">
                <label>OPTION C (OPTIONAL)</label>
                <input type="text" id="opC" placeholder="Answer 3">
            </div>
            <div class="input-group">
                <label>OPTION D (OPTIONAL)</label>
                <input type="text" id="opD" placeholder="Answer 4">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
            <div class="input-group">
                <label>CORRECT KEY</label>
                <select id="correctAns">
                    <option value="A">Option A</option>
                    <option value="B">Option B</option>
                    <option value="C">Option C</option>
                    <option value="D">Option D</option>
                </select>
            </div>
            <div class="input-group">
                <label>DIFFICULTY</label>
                <select id="qLevel">
                    <option value="Level 1">Beginner (Level 1)</option>
                    <option value="Level 2">Intermediate (Level 2)</option>
                </select>
            </div>
        </div>

        <button class="btn-sync" id="saveBtn" onclick="saveData()">
            <span id="btnText">UPLOAD TO DATABASE</span>
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <div class="table-card">
        <div style="padding: 20px; font-weight: bold; color: var(--edu-dark); background: #fafbfc;">RECENTLY ADDED QUESTIONS</div>
        <table>
            <thead>
                <tr>
                    <th>STATUS</th>
                    <th>QUESTION PREVIEW</th>
                    <th>KEY</th>
                    <th>LEVEL</th>
                </tr>
            </thead>
            <tbody id="adminTable">
                <tr><td colspan="4" style="text-align:center; padding:30px; color:#999;">Fetching secure data from LRK Cloud...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypq0a5mRG2pFLs63pyvoxgLz-9w4wPrLbCWI8dVL1VPqT4sX5Obh7f3dq0htjT3oDT/exec";
    let masterData = [];

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const db = await res.json();
            masterData = db.questions && db.questions.length > 1 ? db.questions.slice(1) : [];
            updateUI();
        } catch (e) {
            showToast("Cloud Connection Error!", "danger");
        }
    }

    function updateUI() {
        document.getElementById('totalQ').innerText = masterData.length;
        const level = Math.floor(masterData.length / 50) + 1;
        document.getElementById('currentLvl').innerText = "Level " + level;

        const tbody = document.getElementById('adminTable');
        tbody.innerHTML = masterData.length > 0 ? "" : '<tr><td colspan="4" style="text-align:center; padding:20px;">No questions found in database.</td></tr>';
        
        [...masterData].reverse().slice(0, 8).forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="badge badge-success">● LIVE</span></td>
                <td>${row[1] ? row[1].substring(0, 50) : 'Empty'}...</td>
                <td style="font-weight:bold; color:var(--edu-blue)">${row[6]}</td>
                <td><span class="badge badge-blue">LVL 1</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function showToast(msg, type) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = type === 'success' ? 'var(--success)' : 'var(--danger)';
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function saveData() {
        const q = document.getElementById('qTxt').value.trim();
        const a = document.getElementById('opA').value.trim();
        const b = document.getElementById('opB').value.trim();
        const c = document.getElementById('opC').value.trim();
        const d = document.getElementById('opD').value.trim();
        const ans = document.getElementById('correctAns').value;

        if(!q || !a || !b) return showToast("Question, Option A & B are mandatory!", "danger");

        const btn = document.getElementById('saveBtn');
        const btnTxt = document.getElementById('btnText');
        btn.disabled = true;
        btnTxt.innerText = "UPLOADING TO CLOUD...";

        const payload = {
            type: 'questions',
            action: 'save',
            row: [Date.now().toString(), q, a, b, c, d, ans]
        };

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            });

            showToast("Question Saved Successfully!", "success");
            // Clear inputs
            ['qTxt','opA','opB','opC','opD'].forEach(id => document.getElementById(id).value = "");
            
            setTimeout(loadData, 1500); 
        } catch (e) {
            showToast("Upload Failed!", "danger");
        } finally {
            btn.disabled = false;
            btnTxt.innerText = "UPLOAD TO DATABASE";
        }
    }

    window.onload = loadData;
</script>
</body>
</html>
