<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>R07 TRACKER | LRK INSTITUTE</title>
    <style>
        :root { --red: #ff0000; --dark: #050505; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; padding: 30px; }
        
        .container { max-width: 1000px; margin: auto; }
        h1 { color: var(--red); text-align: center; font-size: 35px; letter-spacing: 5px; text-shadow: 0 0 20px var(--red); }
        .stats { display: flex; justify-content: space-around; margin: 30px 0; }
        .stat-box { background: #111; padding: 20px; border-radius: 15px; border: 1px solid var(--red); min-width: 200px; text-align: center; box-shadow: 0 0 15px rgba(255,0,0,0.1); }
        .stat-box h3 { color: var(--red); margin: 0; font-size: 14px; }
        .stat-box p { font-size: 30px; font-weight: bold; margin: 5px 0; }

        table { width: 100%; border-collapse: collapse; background: rgba(15,15,15,0.9); border-radius: 15px; overflow: hidden; border: 1px solid #333; }
        th { background: #1a0000; color: var(--red); padding: 20px; text-align: left; text-transform: uppercase; font-size: 13px; }
        td { padding: 18px; border-bottom: 1px solid #222; }
        tr:hover { background: rgba(255,0,0,0.05); }
        .badge { background: var(--red); color: white; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>R07 PERFORMANCE DASHBOARD</h1>
        <p style="text-align:center; opacity:0.6;">LRK COMPUTER INSTITUTE MIHINPURWA</p>

        <div class="stats">
            <div class="stat-box"><h3>TOTAL EXAMS</h3><p id="totalCount">0</p></div>
            <div class="stat-box"><h3>SYSTEM STATUS</h3><p style="color:#00ff00; font-size:20px;">ONLINE</p></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Student Name</th>
                    <th>Phone</th>
                    <th>Result Score</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
        </table>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIArbfM8Z1rWkGh8OpJMbSrdGN7Fenh3ffG8jX_WeGKuuSwG6P-hFMkWqF_wOD-6fS/exec";

    async function loadLogs() {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        const logs = data.logs.slice(1);
        
        let html = "";
        logs.reverse().forEach(log => {
            html += `<tr>
                <td style="color:#888; font-size:12px;">${log[0]}</td>
                <td style="font-weight:bold; letter-spacing:1px;">${log[1].toUpperCase()}</td>
                <td>${log[2]}</td>
                <td><span class="badge">${log[3]}</span></td>
            </tr>`;
        });
        document.getElementById('logBody').innerHTML = html;
        document.getElementById('totalCount').innerText = logs.length;
    }
    window.onload = loadLogs;
</script>
</body>
</html>
