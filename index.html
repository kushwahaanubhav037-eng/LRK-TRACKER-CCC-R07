<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R07 TRACKER | LRK INSTITUTE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #ff0000; --dark: #050505; --neon: #ff3333; }
        
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: var(--dark); color: white; margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 50% 50%, #1a0000 0%, #050505 100%);
            min-height: 100vh;
        }

        /* Moving Red Line Animation */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 3px;
            background: var(--red); box-shadow: 0 0 20px var(--red);
            animation: moveLine 3s linear infinite; z-index: 1000;
        }
        @keyframes moveLine { 0% { top: 0; } 100% { top: 100%; } }

        .container { max-width: 1100px; margin: auto; position: relative; z-index: 10; }

        .header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--red); padding-bottom: 20px; }
        .header h1 { font-size: 3rem; color: var(--red); text-shadow: 0 0 20px var(--red); margin: 0; letter-spacing: 5px; font-family: 'Orbitron', sans-serif; }
        .header p { letter-spacing: 3px; opacity: 0.8; margin-top: 5px; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(20, 20, 20, 0.9); padding: 20px; border-radius: 15px; border: 1px solid #333; text-align: center; border-left: 5px solid var(--red); }
        .stat-card h3 { color: var(--red); font-size: 0.8rem; margin: 0; text-transform: uppercase; }
        .stat-card p { font-size: 2rem; font-weight: bold; margin: 10px 0 0 0; }

        /* Table Design */
        .table-wrapper { background: rgba(10, 10, 10, 0.9); border-radius: 20px; border: 1px solid #333; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1a0000; color: var(--red); padding: 20px; text-align: left; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; border-bottom: 2px solid var(--red); }
        td { padding: 18px; border-bottom: 1px solid #222; font-size: 0.9rem; }
        tr:hover { background: rgba(255, 0, 0, 0.05); }

        .badge-score { background: var(--red); color: white; padding: 5px 12px; border-radius: 6px; font-weight: bold; }
        .time-text { color: #00ff00; font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        .phone-text { color: #888; font-size: 0.8rem; }

        #refresh-btn { position: fixed; bottom: 30px; right: 30px; background: var(--red); color: white; border: none; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 20px var(--red); font-size: 1.5rem; transition: 0.3s; }
        #refresh-btn:hover { transform: rotate(180deg); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>R07 TRACKER</h1>
            <p>LRK COMPUTER INSTITUTE - MIHINPURWA</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalTests">0</p>
            </div>
            <div class="stat-card">
                <h3>Cloud Status</h3>
                <p id="status" style="color:#00ff00; font-size:1.5rem;">ONLINE</p>
            </div>
            <div class="stat-card">
                <h3>Last Update</h3>
                <p id="lastUpdate" style="font-size:1rem;">--:--</p>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Student Details</th>
                        <th>Exam Date</th>
                        <th>Test Duration</th>
                        <th>Final Score</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    <tr><td colspan="4" style="text-align:center; padding:50px; color:#555;">Connecting to R07 Cloud...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <button id="refresh-btn" onclick="loadLogs()"><i class="fas fa-sync-alt"></i></button>

    <script>
        // AAPKA GOOGLE SCRIPT URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIArbfM8Z1rWkGh8OpJMbSrdGN7Fenh3ffG8jX_WeGKuuSwG6P-hFMkWqF_wOD-6fS/exec";

        async function loadLogs() {
            document.getElementById('status').innerText = "SYNCING...";
            document.getElementById('status').style.color = "yellow";

            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                
                // Logs data ko slice(1) karke header hatana aur reverse karke latest pehle dikhana
                const logs = data.logs.slice(1).reverse();
                
                let html = "";
                logs.forEach(log => {
                    // Log data columns: 0:Date, 1:Name, 2:Phone, 3:Score, 4:Duration
                    html += `
                        <tr>
                            <td>
                                <div style="font-weight:bold; font-size:1.1rem; text-transform:uppercase;">${log[1]}</div>
                                <div class="phone-text"><i class="fas fa-phone"></i> ${log[2]}</div>
                            </td>
                            <td style="font-size:0.8rem; color:#aaa;">${log[0]}</td>
                            <td class="time-text"><i class="fas fa-clock"></i> ${log[4] || 'N/A'}</td>
                            <td><span class="badge-score">${log[3]}</span></td>
                        </tr>
                    `;
                });

                document.getElementById('logBody').innerHTML = html || "<tr><td colspan='4' style='text-align:center;'>No records found.</td></tr>";
                document.getElementById('totalTests').innerText = logs.length;
                document.getElementById('status').innerText = "ONLINE";
                document.getElementById('status').style.color = "#00ff00";
                document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString();

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "OFFLINE";
                document.getElementById('status').style.color = "red";
                document.getElementById('logBody').innerHTML = "<tr><td colspan='4' style='text-align:center; color:red;'>FAILED TO FETCH DATA. CHECK INTERNET.</td></tr>";
            }
        }

        // Page load hote hi data fetch karein
        window.onload = loadLogs;

        // Har 30 second mein auto-refresh
        setInterval(loadLogs, 30000);
    </script>
</body>
</html>
